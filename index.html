<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOSTER 2026 - May & April</title>

<style>
:root {
  --bg1: #0f172a;
  --bg2: #020617;
  --card: #0f172a;
  --accent: #60a5fa;
}
body {
  background: radial-gradient(circle at top, var(--bg1), var(--bg2));
  color: #f8fafc;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 15px;
}
.container { max-width: 1300px; margin: auto; }
.card {
  background: var(--card);
  border: 1px solid #1e293b;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}
.title { text-align: center; font-size: 38px; font-weight: 900; color: var(--accent); margin: 0 0 20px; }
.tabs {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 20px;
}
.tab-btn {
  padding: 12px 28px;
  font-size: 18px;
  font-weight: bold;
  background: #111827;
  border: none;
  border-radius: 9999px;
  color: #cbd5e1;
  cursor: pointer;
}
.tab-btn.active {
  background: #2563eb;
  color: white;
}

.upload-area {
  border: 2px dashed #334155;
  border-radius: 16px;
  padding: 25px;
  text-align: center;
  cursor: pointer;
  margin: 15px 0;
}
.upload-area:hover { border-color: #60a5fa; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #111827; padding: 12px 8px; }
td { padding: 10px 8px; text-align: center; border-bottom: 1px solid #1e293b; }
td[contenteditable=true] { background: rgba(37,99,235,0.25); cursor: text; }
.kw { background: rgba(250,204,21,0.25)!important; color: #fde047!important; font-weight: bold; }
.d  { background: rgba(34,197,94,0.25)!important; color: #86efac!important; font-weight: bold; }
.x  { background: rgba(239,68,68,0.25)!important; color: #fca5a5!important; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">ROOSTER 2026</h1>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(0)">Mei 2026</button>
    <button class="tab-btn" onclick="switchTab(1)">April 2026</button>
  </div>

  <div class="card" id="content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
// ================== DATA ==================
let dataMei = JSON.parse(localStorage.getItem("meiData")) || [
  ["1","VR","KW","4","X","","DAG VAN ARBEID"],["2","ZA","D","12","X","",""],["3","ZO","X","","D","12",""],
  ["4","MA","D","12","A","12",""],["5","DI","KW","4","A","12",""],["6","WO","KW","4","X","",""],
  ["7","DO","KW","4","R","",""],["8","VR","D","12","R","",""],["9","ZA","X","","X","",""],
  ["10","ZO","X-D","","D-X","12",""],["11","MA","D-X","12","X-D","",""],["12","DI","KW","4","A","12",""],
  ["13","WO","KW","4","A","12",""],["14","DO","KW","4","X","","HEMELVAART"],["15","VR","KW","4","R","",""],
  ["16","ZA","X","","R","",""],["17","ZO","X","","X","",""],["18","MA","KW","4","D*","8",""],
  ["19","DI","KW","4","D*","8",""],["20","WO","D","12","A","12",""],["21","DO","KW","4","A","12",""],
  ["22","VR","KW","4","X","",""],["23","ZA","D=X","12","R","","VG"],["24","ZO","X","","R","",""],
  ["25","MA","KW","4","X","",""],["26","DI","D","12","X","",""],["27","WO","KW","4","D*","8",""],
  ["28","DO","KW","4","A","12",""],["29","VR","KW","4","A","12",""],["30","ZA","X","","X","",""],
  ["31","ZO","X","","R","",""]
];

let dataApril = JSON.parse(localStorage.getItem("aprilData")) || [
  ["1","WO","X","4","KW","4",""],["2","DO","D*","8","KW","4","Goede Vrijdag"],
  ["3","VR","D*","8","KW","4",""],["4","ZA","A","12","X","0",""],
  ["5","ZO","A","12","X","0","Pasen"],["6","MA","X","4","KW","4","2de Paasdag"],
  ["7","DI","R=D*","8","KW","4",""],["8","WO","R=D*","8","KW","4",""],
  ["9","DO","X","4","KW","4",""],["10","VR","VAK","0","A","12",""],
  ["11","ZA","VAK","0","A","12",""],["12","ZO","VAK","0","X","0",""],
  ["13","MA","VAK","0","R=A","12",""],["14","DI","VAK","0","R","0",""],
  ["15","WO","X","4","KW","4",""],["16","DO","X","4","KW","4",""],
  ["17","VR","VAK","0","D*","8",""],["18","ZA","VAK","0","A","12",""],
  ["19","ZO","VAK","0","A","12",""],["20","MA","VAK","0","X","0",""],
  ["21","DI","VAK","0","R=A","12",""],["22","WO","X","4","KW","4",""],
  ["23","DO","X","4","KW","4",""],["24","VR","R","0","D","12",""],
  ["25","ZA","X","0","D","12",""],["26","ZO","D","12","A","12",""],
  ["27","MA","X","4","D","12","Koningsdag"],["28","DI","A","12","X","0",""],
  ["29","WO","A","12","KW","4",""],["30","DO","X","4","KW","4",""]
];

function getHours(v) {
  v = (v || "").toString().toUpperCase();
  if (v.includes("D*")) return 8;
  if (v.includes("D")) return 12;
  if (v === "A") return 12;
  if (v.includes("KW")) return 4;
  return 0;
}

// ================== SWITCH TABS ==================
function switchTab(n) {
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === n);
  });
  if (n === 0) loadMonth("Mei", dataMei);
  else loadMonth("April", dataApril);
}

function loadMonth(name, data) {
  let html = `
    <h2 style="text-align:center; color:#60a5fa;">${name} 2026</h2>
    
    <div class="upload-area" onclick="document.getElementById('upload-${name}').click()">
      📸 Upload rooster foto (auto saved)<br>
      <input type="file" id="upload-${name}" accept="image/*" style="display:none" onchange="uploadImage('${name}', event)">
    </div>
    <img id="img-${name}" style="width:100%; border-radius:12px; margin:10px 0; display:${localStorage.getItem('img_'+name)?'block':'none'}" 
         src="${localStorage.getItem('img_'+name)||''}">

    <table id="proTable">
      <thead>
        <tr>
          <th>DATUM</th><th>DAG</th><th>GMA</th><th>U</th><th>JPA</th><th>U</th><th>OPMERKING</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div style="margin-top:15px; text-align:center;">
      <button onclick="exportCurrent('${name}')" style="padding:10px 20px; background:#2563eb; color:white; border:none; border-radius:8px;">Export Excel</button>
    </div>
  `;

  document.getElementById("content").innerHTML = html;
  renderProTable(name, data);
}

function renderProTable(monthName, data) {
  const tbody = document.querySelector("#proTable tbody");
  tbody.innerHTML = "";

  data.forEach((row, i) => {
    const tr = document.createElement("tr");
    row.forEach((cell, j) => {
      const td = document.createElement("td");
      td.contentEditable = true;
      td.textContent = cell || "";
      
      if (j === 2 || j === 4) {
        let v = (cell+"").toUpperCase();
        if (v.includes("KW")) td.classList.add("kw");
        else if (v.includes("D")) td.classList.add("d");
        else if (v.includes("X")) td.classList.add("x");
      }
      
      td.onblur = () => {
        data[i][j] = td.textContent.trim();
        if (j === 2) data[i][3] = getHours(data[i][2]);
        if (j === 4) data[i][5] = getHours(data[i][4]);
        
        if (monthName === "Mei") localStorage.setItem("meiData", JSON.stringify(dataMei));
        else localStorage.setItem("aprilData", JSON.stringify(dataApril));
      };
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function uploadImage(month, e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    localStorage.setItem('img_' + month, ev.target.result);
    loadMonth(month, month === "Mei" ? dataMei : dataApril);
  };
  reader.readAsDataURL(file);
}

function exportCurrent(month) {
  const data = month === "Mei" ? dataMei : dataApril;
  const ws = XLSX.utils.aoa_to_sheet([["DATUM","DAG","GMA","U","JPA","U","OPMERKING"], ...data]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, month);
  XLSX.writeFile(wb, `Rooster_${month}_2026.xlsx`);
}

// Start with Mei
switchTab(0);
</script>
</body>
</html>
