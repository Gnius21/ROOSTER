<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOSTER 2026 - Full Schedule Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

:root{
  --bg:#0b1020;
  --card:#131c31;
  --border:#23304d;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --green:#22c55e;
  --orange:#fb923c;
  --red:#ef4444;
  --purple:#a855f7;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:linear-gradient(135deg,#050816,#0f172a);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  min-height:100vh;
  padding:24px;
}

.container{
  max-width:1500px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.header h1{
  font-size:56px;
  font-weight:900;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.header p{
  color:var(--muted);
  margin-top:8px;
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:25px;
  justify-content:center;
}

.tab-btn{
  padding:12px 22px;
  border:none;
  border-radius:10px;
  background:#172036;
  color:var(--text);
  cursor:pointer;
  transition:.25s;
  font-weight:700;
}

.tab-btn:hover{
  transform:translateY(-2px);
}

.tab-btn.active{
  background:var(--accent);
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.month-title{
  font-size:34px;
  margin-bottom:24px;
  color:var(--accent2);
  text-align:center;
}

.upload-box{
  border:2px dashed var(--accent);
  border-radius:14px;
  padding:34px;
  text-align:center;
  margin-bottom:25px;
  background:rgba(59,130,246,.05);
  cursor:pointer;
  transition:.25s;
}

.upload-box:hover{
  background:rgba(59,130,246,.12);
}

.upload-box.dragging{
  background:rgba(96,165,250,.16);
}

.upload-box h3{
  margin-bottom:10px;
}

.upload-box p{
  color:var(--muted);
}

input[type=file]{
  display:none;
}

.image-preview{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:12px;
  margin-bottom:25px;
  display:none;
  border:1px solid var(--border);
}

.table-wrap{
  overflow:auto;
  max-height:75vh;
  border-radius:12px;
  border:1px solid var(--border);
}

table{
  width:100%;
  border-collapse:collapse;
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
}

thead{
  position:sticky;
  top:0;
  background:#0f172a;
  z-index:10;
}

th{
  padding:14px;
  border-bottom:2px solid var(--accent);
  color:var(--accent2);
}

td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid var(--border);
  transition:.2s;
}

tr:hover td{
  background:rgba(59,130,246,.05);
}

td[contenteditable=true]{
  background:rgba(59,130,246,.08);
}

td[contenteditable=true]:focus{
  outline:none;
  background:rgba(59,130,246,.18);
  box-shadow:inset 0 0 0 2px var(--accent);
}

.kw{
  background:rgba(251,146,60,.18)!important;
  color:#fb923c;
  font-weight:700;
}

.d{
  background:rgba(34,197,94,.18)!important;
  color:#4ade80;
  font-weight:700;
}

.x{
  background:rgba(239,68,68,.18)!important;
  color:#fca5a5;
  font-weight:700;
}

.dstar{
  background:rgba(168,85,247,.18)!important;
  color:#d8b4fe;
  font-weight:700;
}

.total-box{
  margin-top:24px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.total{
  background:#0f172a;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.total h3{
  font-size:14px;
  color:var(--muted);
  margin-bottom:8px;
}

.total p{
  font-size:34px;
  font-weight:900;
}

.actions{
  margin-top:24px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:10px;
  padding:13px 24px;
  font-weight:700;
  cursor:pointer;
  transition:.25s;
  font-family:'Outfit',sans-serif;
}

.primary{
  background:var(--accent);
  color:white;
}

.secondary{
  background:#1e293b;
  color:white;
  border:1px solid var(--border);
}

button:hover{
  transform:translateY(-2px);
}

@media(max-width:768px){

  .header h1{
    font-size:38px;
  }

  table{
    font-size:12px;
  }

  th,td{
    padding:8px 5px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📅 ROOSTER 2026</h1>
    <p>Interactive Editable Schedule Manager</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card">

    <h2 class="month-title" id="monthTitle"></h2>

    <label class="upload-box" id="uploadBox">
      <h3>📸 Upload Rooster Foto</h3>
      <p>Click or drag image here</p>
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <img id="preview" class="image-preview">

    <div class="table-wrap">
      <table id="roosterTable">
        <thead>
          <tr>
            <th>DAG</th>
            <th>DAT</th>
            <th>JPA</th>
            <th>U</th>
            <th>GMA</th>
            <th>U</th>
            <th>TOTAAL</th>
            <th>OPMERKING</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="total-box">

      <div class="total">
        <h3>JPA HOURS</h3>
        <p id="jpaTotal">0</p>
      </div>

      <div class="total">
        <h3>GMA HOURS</h3>
        <p id="gmaTotal">0</p>
      </div>

      <div class="total">
        <h3>TOTAL HOURS</h3>
        <p id="grandTotal">0</p>
      </div>

    </div>

    <div class="actions">
      <button class="primary" onclick="saveCurrentMonth()">💾 Save</button>
      <button class="secondary" onclick="exportCSV()">📥 Export CSV</button>
      <button class="secondary" onclick="resetMonth()">🗑️ Reset Month</button>
    </div>

  </div>
</div>

<script>

const months = [
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"
];

let currentMonth = "May";

const monthData = {

May: [
["VR","1","KW","4","X","0","4","DAG VAN ARBEID"],
["ZA","2","D","12","X","0","12",""],
["ZO","3","X","0","D","12","12",""],
["MA","4","D","12","A","12","24",""],
["DI","5","KW","4","A","12","16",""],
["WO","6","KW","4","X","0","4",""],
["DO","7","KW","4","R","0","4",""],
["VR","8","D","12","R","0","12",""],
["ZA","9","X","0","X","0","0",""],
["ZO","10","X-D","12","D-X","12","24",""],
["MA","11","D-X","12","X-D","12","24",""],
["DI","12","KW","4","A","12","16",""],
["WO","13","KW","4","A","12","16",""],
["DO","14","KW","4","X","0","4","HEMELVAART"],
["VR","15","KW","4","R","0","4",""],
["ZA","16","X","0","R","0","0",""],
["ZO","17","X","0","X","0","0",""],
["MA","18","KW","4","D*","8","12",""],
["DI","19","KW","4","D*","8","12",""],
["WO","20","D","12","A","12","24",""],
["DO","21","KW","4","A","12","16",""],
["VR","22","KW","4","X","0","4",""],
["ZA","23","D=X","12","R","0","12","VG"],
["ZO","24","X","0","R","0","0",""],
["MA","25","KW","4","X","0","4",""],
["DI","26","D","12","X","0","12",""],
["WO","27","KW","4","D*","8","12",""],
["DO","28","KW","4","A","12","16",""],
["VR","29","KW","4","A","12","16",""],
["ZA","30","X","0","X","0","0",""],
["ZO","31","X","0","R","0","0",""]
],

June: [
["MA","1","R","0","D","12","12",""],
["DI","2","X","0","KW","4","4",""],
["WO","3","D*","8","KW","4","12",""],
["DO","4","D*","8","KW","4","12",""],
["VR","5","A","12","KW","4","16",""],
["ZA","6","A","12","X","0","12",""],
["ZO","7","X","0","X","0","0",""],
["MA","8","R","0","KW","4","4",""],
["DI","9","R","0","D","12","12",""],
["WO","10","X","0","KW","4","4",""],
["DO","11","X","0","D","12","12",""],
["VR","12","D*","8","KW","4","12",""],
["ZA","13","A","12","X","0","12",""],
["ZO","14","A","12","X","0","12",""],
["MA","15","X","0","KW","4","4",""],
["DI","16","R","0","KW","4","4",""],
["WO","17","R","0","D","12","12",""],
["DO","18","X","0","KW","4","4",""],
["VR","19","D*","8","KW","4","12",""],
["ZA","20","D","12","X","0","12",""],
["ZO","21","A","12","X","0","12",""],
["MA","22","A","12","KW","4","16",""],
["DI","23","X","0","KW","4","4",""],
["WO","24","R","0","KW","4","4",""],
["DO","25","R","0","KW","4","4",""],
["VR","26","X","0","KW","4","4",""],
["ZA","27","X","0","D","12","12",""],
["ZO","28","D","12","X","0","12",""],
["MA","29","A","12","D","12","24",""],
["DI","30","A","12","KW","4","16",""]
]

};

function createEmptyMonth(days){

  const weekdays = ["MA","DI","WO","DO","VR","ZA","ZO"];

  const arr = [];

  for(let i=1;i<=days;i++){

    arr.push([
      weekdays[(i-1)%7],
      i,
      "",
      "0",
      "",
      "0",
      "0",
      ""
    ]);

  }

  return arr;

}

monthData["April"] = createEmptyMonth(30);
monthData["July"] = createEmptyMonth(31);
monthData["August"] = createEmptyMonth(31);
monthData["September"] = createEmptyMonth(30);
monthData["October"] = createEmptyMonth(31);
monthData["November"] = createEmptyMonth(30);
monthData["December"] = createEmptyMonth(31);

const tbody = document.querySelector("#roosterTable tbody");

function getHours(v){

  v = (v || "").toUpperCase().trim();

  if(v.includes("D*")) return 8;
  if(v.includes("KW")) return 4;
  if(v.includes("D")) return 12;
  if(v === "A") return 12;

  return 0;

}

function applyClass(td,val){

  td.classList.remove("kw","d","x","dstar");

  const v = val.toUpperCase();

  if(v.includes("D*")){
    td.classList.add("dstar");
  }
  else if(v.includes("KW")){
    td.classList.add("kw");
  }
  else if(v.includes("X")){
    td.classList.add("x");
  }
  else if(v.includes("D") || v==="A"){
    td.classList.add("d");
  }

}

function renderTabs(){

  const tabs = document.getElementById("tabs");

  tabs.innerHTML = "";

  months.forEach(month=>{

    const btn = document.createElement("button");

    btn.className = "tab-btn";

    if(month === currentMonth){
      btn.classList.add("active");
    }

    btn.textContent = month;

    btn.onclick = ()=>{

      currentMonth = month;

      renderTabs();
      renderMonth();
      loadImage();

    };

    tabs.appendChild(btn);

  });

}

function renderMonth(){

  document.getElementById("monthTitle").textContent =
    currentMonth + " 2026";

  tbody.innerHTML = "";

  const data = monthData[currentMonth];

  data.forEach((row,rowIndex)=>{

    const tr = document.createElement("tr");

    row.forEach((cell,colIndex)=>{

      const td = document.createElement("td");

      td.textContent = cell;

      if(colIndex === 2 || colIndex === 4 || colIndex === 7){

        td.contentEditable = true;

        td.addEventListener("paste",(e)=>{
          e.preventDefault();
          const text = e.clipboardData.getData("text/plain");
          document.execCommand("insertText",false,text);
        });

      }

      if(colIndex === 2 || colIndex === 4){
        applyClass(td,cell);
      }

      td.onblur = ()=>{

        monthData[currentMonth][rowIndex][colIndex] =
          td.textContent.trim().toUpperCase();

        if(colIndex === 2){

          const val = monthData[currentMonth][rowIndex][2];

          monthData[currentMonth][rowIndex][3] =
            getHours(val);

        }

        if(colIndex === 4){

          const val = monthData[currentMonth][rowIndex][4];

          monthData[currentMonth][rowIndex][5] =
            getHours(val);

        }

        const total =
          Number(monthData[currentMonth][rowIndex][3]) +
          Number(monthData[currentMonth][rowIndex][5]);

        monthData[currentMonth][rowIndex][6] = total;

        renderMonth();
        calculateTotals();

      };

      tr.appendChild(td);

    });

    tbody.appendChild(tr);

  });

  calculateTotals();

}

function calculateTotals(){

  let jpa = 0;
  let gma = 0;

  monthData[currentMonth].forEach(r=>{

    jpa += Number(r[3]);
    gma += Number(r[5]);

  });

  document.getElementById("jpaTotal").textContent = jpa;
  document.getElementById("gmaTotal").textContent = gma;
  document.getElementById("grandTotal").textContent = jpa + gma;

}

function saveCurrentMonth(){

  localStorage.setItem(
    "rooster_" + currentMonth,
    JSON.stringify(monthData[currentMonth])
  );

  alert(currentMonth + " saved.");

}

function loadSavedMonths(){

  months.forEach(month=>{

    const saved = localStorage.getItem("rooster_" + month);

    if(saved){

      monthData[month] = JSON.parse(saved);

    }

  });

}

function exportCSV(){

  let csv = "DAG,DAT,JPA,U,GMA,U,TOTAAL,OPMERKING\n";

  monthData[currentMonth].forEach(r=>{

    csv += r.join(",") + "\n";

  });

  const blob = new Blob([csv],{type:"text/csv"});

  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);

  a.download = currentMonth + "_2026.csv";

  a.click();

}

function resetMonth(){

  if(confirm("Reset " + currentMonth + "?")){

    localStorage.removeItem("rooster_" + currentMonth);

    location.reload();

  }

}

const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");

uploadBox.addEventListener("dragover",(e)=>{

  e.preventDefault();

  uploadBox.classList.add("dragging");

});

uploadBox.addEventListener("dragleave",()=>{

  uploadBox.classList.remove("dragging");

});

uploadBox.addEventListener("drop",(e)=>{

  e.preventDefault();

  uploadBox.classList.remove("dragging");

  const file = e.dataTransfer.files[0];

  if(file){

    fileInput.files = e.dataTransfer.files;

    showImage(file);

  }

});

fileInput.addEventListener("change",(e)=>{

  const file = e.target.files[0];

  if(file){
    showImage(file);
  }

});

function showImage(file){

  const reader = new FileReader();

  reader.onload = (e)=>{

    preview.src = e.target.result;

    preview.style.display = "block";

    localStorage.setItem(
      "image_" + currentMonth,
      e.target.result
    );

  };

  reader.readAsDataURL(file);

}

function loadImage(){

  const img = localStorage.getItem(
    "image_" + currentMonth
  );

  if(img){

    preview.src = img;

    preview.style.display = "block";

  }else{

    preview.style.display = "none";

  }

}

loadSavedMonths();
renderTabs();
renderMonth();
loadImage();

</script>

</body>
</html>
