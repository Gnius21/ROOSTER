name = "rooster-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# After deploying, set your Anthropic API key as a secret:
#   wrangler secret put ANTHROPIC_API_KEY
#
# The Worker URL will look like:
#   https://rooster-proxy.<your-cf-subdomain>.workers.dev
# Paste that URL into the Rooster app's upload-zone settings field.
