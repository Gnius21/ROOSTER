<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#0d1020"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Calendar hangers -->
  <rect x="152" y="58" width="26" height="60" rx="13" fill="#e8692a"/>
  <rect x="334" y="58" width="26" height="60" rx="13" fill="#e8692a"/>

  <!-- Calendar outer frame bottom half (dark) -->
  <rect x="56" y="164" width="400" height="284" rx="0" fill="#161b27"/>
  <rect x="56" y="424" width="400" height="24" rx="0" ry="0" fill="#161b27"/>
  <rect x="56" y="164" width="400" height="288" rx="0" fill="#161b27"/>
  <!-- Round bottom corners of calendar -->
  <rect x="56" y="160" width="400" height="296" rx="24" fill="#161b27"/>

  <!-- Orange header band -->
  <rect x="56" y="86" width="400" height="100" rx="24" fill="#e8692a"/>
  <!-- Straight-bottom filler so header meets body -->
  <rect x="56" y="162" width="400" height="24" fill="#e8692a"/>

  <!-- Divider line -->
  <rect x="56" y="185" width="400" height="3" fill="#252f42"/>

  <!-- Grid cells — 3 columns × 4 rows -->
  <!-- col x: 76, 208, 340  width: 108   gap: 24 -->
  <!-- row y: 204, 264, 324, 384  height: 44  gap: 20 -->

  <!-- Row 1 -->
  <rect x="76"  y="204" width="108" height="44" rx="10" fill="#252f42"/>
  <rect x="208" y="204" width="108" height="44" rx="10" fill="#e8692a"/>
  <rect x="340" y="204" width="96"  height="44" rx="10" fill="#252f42"/>

  <!-- Row 2 -->
  <rect x="76"  y="264" width="108" height="44" rx="10" fill="#e8692a" opacity="0.8"/>
  <rect x="208" y="264" width="108" height="44" rx="10" fill="#252f42"/>
  <rect x="340" y="264" width="96"  height="44" rx="10" fill="#e8692a" opacity="0.55"/>

  <!-- Row 3 -->
  <rect x="76"  y="324" width="108" height="44" rx="10" fill="#252f42"/>
  <rect x="208" y="324" width="108" height="44" rx="10" fill="#e8692a" opacity="0.65"/>
  <rect x="340" y="324" width="96"  height="44" rx="10" fill="#252f42"/>

  <!-- Row 4 -->
  <rect x="76"  y="384" width="108" height="44" rx="10" fill="#e8692a" opacity="0.45"/>
  <rect x="208" y="384" width="108" height="44" rx="10" fill="#252f42"/>
  <rect x="340" y="384" width="96"  height="44" rx="10" fill="#e8692a" opacity="0.6"/>
</svg>
