<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#0d1020"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Header row (column titles) -->
  <rect x="80" y="52" width="152" height="52" rx="12" fill="#e8692a"/>
  <rect x="248" y="52" width="152" height="52" rx="12" fill="#e8692a" opacity="0.6"/>

  <!-- Divider -->
  <rect x="56" y="116" width="400" height="3" rx="1" fill="#252f42"/>

  <!-- Thin day-indicator strip (left) + 2 shift columns — 5 rows (Mon–Fri) -->

  <!-- ROW 1 — MA -->
  <rect x="56"  y="130" width="12" height="56" rx="4" fill="#e8692a" opacity="0.45"/>
  <rect x="80"  y="130" width="152" height="56" rx="12" fill="#e8692a"/>          <!-- D -->
  <rect x="248" y="130" width="152" height="56" rx="12" fill="#1c2333"/>           <!-- X -->

  <!-- ROW 2 — DI -->
  <rect x="56"  y="198" width="12" height="56" rx="4" fill="#e8692a" opacity="0.45"/>
  <rect x="80"  y="198" width="152" height="56" rx="12" fill="#1c2333"/>           <!-- X -->
  <rect x="248" y="198" width="152" height="56" rx="12" fill="#e8692a"/>           <!-- D -->

  <!-- ROW 3 — WO -->
  <rect x="56"  y="266" width="12" height="56" rx="4" fill="#e8692a" opacity="0.45"/>
  <rect x="80"  y="266" width="152" height="56" rx="12" fill="#e8692a"/>           <!-- D -->
  <rect x="248" y="266" width="152" height="56" rx="12" fill="#e8692a" opacity="0.55"/> <!-- A -->

  <!-- ROW 4 — DO -->
  <rect x="56"  y="334" width="12" height="56" rx="4" fill="#e8692a" opacity="0.45"/>
  <rect x="80"  y="334" width="152" height="56" rx="12" fill="#e8692a" opacity="0.35"/> <!-- R -->
  <rect x="248" y="334" width="152" height="56" rx="12" fill="#e8692a"/>           <!-- D -->

  <!-- ROW 5 — VR -->
  <rect x="56"  y="402" width="12" height="56" rx="4" fill="#e8692a" opacity="0.45"/>
  <rect x="80"  y="402" width="152" height="56" rx="12" fill="#e8692a"/>           <!-- D -->
  <rect x="248" y="402" width="152" height="56" rx="12" fill="#1c2333"/>           <!-- X -->
</svg>
